name: Hydrology data pipeline

on:
  workflow_dispatch:
    inputs:
      validation_only:
        description: Validate providers, history, canonical and linked outputs without pushing data
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '0 */6 * * *'
    - cron: '30 2 * * *'
    - cron: '0 3 * * 0'

permissions:
  contents: write

concurrency:
  group: hydrology-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      validation_only: ${{ steps.pipeline_mode.outputs.validation_only }}
      generated_data_sha: ${{ steps.generated_data.outputs.generated_data_sha }}
    env:
      EPIAS_USERNAME: ${{ secrets.EPIAS_USERNAME }}
      EPIAS_PASSWORD: ${{ secrets.EPIAS_PASSWORD }}
      EPIAS_TGT_URL: ${{ secrets.EPIAS_TGT_URL }}
      EPIAS_DAM_ENDPOINT: ${{ secrets.EPIAS_DAM_ENDPOINT }}
      DAHITI_API_KEY: ${{ secrets.DAHITI_API_KEY }}
      HYDROWEB_API_KEY: ${{ secrets.HYDROWEB_API_KEY }}
      COPERNICUS_ACCESS_TOKEN: ${{ secrets.COPERNICUS_ACCESS_TOKEN }}
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      HYDRO_VALIDATION_ONLY: ${{ github.event_name == 'workflow_dispatch' && (inputs.validation_only == true || github.ref_name != github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/hydro/requirements.txt

      - name: Record pipeline mode
        id: pipeline_mode
        shell: bash
        run: echo "validation_only=$HYDRO_VALIDATION_ONLY" >> "$GITHUB_OUTPUT"

      - name: Prepare validation history workspace
        if: env.HYDRO_VALIDATION_ONLY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VALIDATION_HISTORY_ROOT="$RUNNER_TEMP/hydrology-validation-history"
          mkdir -p "$VALIDATION_HISTORY_ROOT"
          echo "HYDRO_HISTORY_ROOT=$VALIDATION_HISTORY_ROOT" >> "$GITHUB_ENV"

      - name: Prepare persistent history branch
        if: env.HYDRO_VALIDATION_ONLY != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          HISTORY_WORKTREE="$RUNNER_TEMP/hydrology-history"
          echo "HISTORY_WORKTREE=$HISTORY_WORKTREE" >> "$GITHUB_ENV"
          echo "HYDRO_HISTORY_ROOT=$HISTORY_WORKTREE/data/history/fullness" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --heads origin data-history >/dev/null 2>&1; then
            git clone --depth=1 --branch data-history "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$HISTORY_WORKTREE"
          else
            mkdir -p "$HISTORY_WORKTREE"
            git -C "$HISTORY_WORKTREE" init
            git -C "$HISTORY_WORKTREE" checkout --orphan data-history
            git -C "$HISTORY_WORKTREE" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          git -C "$HISTORY_WORKTREE" config user.name 'github-actions[bot]'
          git -C "$HISTORY_WORKTREE" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p "$HISTORY_WORKTREE/data/history/fullness"

      - name: Refresh TATUS and river mapping
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * 0'
        run: |
          python tools/hydro/fetch_tatus.py
          python tools/hydro/build_river_reach_map.py

      - name: Refresh GEOGLOWS
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */6 * * *'
        run: python tools/hydro/fetch_geoglows.py

      - name: Check EPİAŞ credentials
        id: epias_credentials
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */6 * * *'
        shell: bash
        run: |
          if [[ -n "${EPIAS_USERNAME:-}" && -n "${EPIAS_PASSWORD:-}" && -n "${EPIAS_TGT_URL:-}" && -n "${EPIAS_DAM_ENDPOINT:-}" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch EPİAŞ
        if: (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */6 * * *') && steps.epias_credentials.outputs.available == 'true'
        run: python tools/hydro/fetch_epias.py

      - name: EPİAŞ skipped (credentials are not configured)
        if: (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */6 * * *') && steps.epias_credentials.outputs.available == 'false'
        run: echo 'EPİAŞ fetch skipped because all required credentials are absent.'

      - name: Fetch DSİ
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */6 * * *'
        run: python tools/hydro/fetch_dsi.py

      - name: Refresh optional provider catalogs
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 2 * * *'
        run: |
          python tools/hydro/fetch_observation_catalogs.py
          python tools/hydro/fetch_hydroweb.py
          python tools/hydro/fetch_copernicus.py --mode incremental
          python tools/hydro/fetch_dahiti.py
          python tools/hydro/fetch_swot.py
          python tools/hydro/fetch_sentinel2.py

      - name: Refresh persistent history before write
        if: env.HYDRO_VALIDATION_ONLY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git -C "$HISTORY_WORKTREE" rev-parse --verify HEAD >/dev/null 2>&1; then
            git -C "$HISTORY_WORKTREE" pull --rebase origin data-history
          fi

      - name: Build and validate canonical package
        env:
          HYDRO_WORKFLOW_STATUS: ${{ github.event_name }}
          HYDRO_HISTORY_PERSISTED: 'false'
          HYDRO_DEPLOY_SUCCEEDED: 'false'
        run: |
          python -m unittest discover -s tools/hydro/tests -t .
          python tools/hydro/build_all.py
          python tools/hydro/test_fullness_quality.py

      - name: Persist history branch
        id: persist_history
        if: env.HYDRO_VALIDATION_ONLY != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git -C "$HISTORY_WORKTREE" add data/history
          if git -C "$HISTORY_WORKTREE" diff --cached --quiet; then
            echo 'No new history snapshot; the archive write is already represented.'
          else
            git -C "$HISTORY_WORKTREE" commit -m "data: archive hydrology snapshot $(date -u +%F)"
            git -C "$HISTORY_WORKTREE" push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:data-history
          fi
          echo 'history_persisted=true' >> "$GITHUB_OUTPUT"

      - name: Publish archive-backed health metadata
        if: steps.persist_history.outputs.history_persisted == 'true' || env.HYDRO_VALIDATION_ONLY == 'true'
        env:
          HYDRO_WORKFLOW_STATUS: ${{ github.event_name }}
          HYDRO_HISTORY_PERSISTED: ${{ steps.persist_history.outputs.history_persisted || 'false' }}
          HYDRO_HISTORY_SKIP_ARCHIVE_WRITE: ${{ env.HYDRO_VALIDATION_ONLY == 'true' && 'false' || 'true' }}
          HYDRO_DEPLOY_SUCCEEDED: 'false'
        run: |
          python tools/hydro/audit_fullness_sources.py
          python tools/hydro/build_linked_hes.py
          python tools/validate_hes177.py

      - name: Commit generated hydrology data
        id: generated_data
        if: env.HYDRO_VALIDATION_ONLY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/public/hydrology/data reports
          if git diff --cached --quiet; then
            echo 'No hydrology data changes.'
          else
            git commit -m 'data: refresh hydrology snapshot'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "generated_data_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy-production:
    if: github.ref_name == github.event.repository.default_branch && needs.build.result == 'success' && needs.build.outputs.validation_only != 'true'
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.build.outputs.generated_data_sha }}
