name: 3D Chromium visual smoke

on:
  pull_request:
    paths:
      - 'app/src/pages/ThreeDPage.tsx'
      - 'app/src/components/ui/ThreeDModel.tsx'
      - 'app/src/utils/layout3d*.ts'
      - 'app/src/index.css'
      - 'app/scripts/3d-webgl-smoke.mjs'
      - '.github/workflows/3d-visual-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Build production app
        run: npm run build
      - name: Install isolated visual QA dependencies
        run: |
          # Do not re-resolve the application's locked dependency graph:
          # npm 11 can throw Arborist edgesOut while mixing --no-save installs.
          mkdir -p /tmp/pdhes-visual-tooling
          npm install --prefix /tmp/pdhes-visual-tooling --no-audit --no-fund playwright pngjs
          ln -s /tmp/pdhes-visual-tooling/node_modules/playwright node_modules/playwright
          ln -s /tmp/pdhes-visual-tooling/node_modules/pngjs node_modules/pngjs
      - name: Install Chromium and runtime libraries
        run: npx playwright install --with-deps chromium
      - name: Start local production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/pdhes-vite-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pdhes-vite-preview.log
          exit 1
      - name: Capture actual WebGL first paint and camera preset
        run: node scripts/3d-webgl-smoke.mjs
      - name: Upload real Chromium screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-3d-visual-${{ github.run_id }}
          path: app/visual-artifacts/
          if-no-files-found: warn
          retention-days: 7
